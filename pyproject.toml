[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rag-api"
version = "0.1.0"
description = "Portfolio demo: a FastAPI retrieval-augmented generation service with pluggable LLM providers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arpan Bom" }]
keywords = ["rag", "fastapi", "llm", "chroma", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb==0.6.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "overrides>=7.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/applycoding/llm-rag-api"
Repository = "https://github.com/applycoding/llm-rag-api"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
